# ШАБЛОН. Настоящие значения сюда не пишем и в git не коммитим.
# Рекомендуемый способ создать секрет - командой из README (kubectl create secret ...).
# Если удобнее файлом: cp secret.example.yaml secret.yaml (он в .gitignore),
# впиши значения и выполни kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  namespace: llm-inference
type: Opaque
stringData:                      # stringData - обычный текст, Kubernetes сам закодирует в base64
  HF_TOKEN: "hf_REPLACE_ME"      # токен Hugging Face (Read); для открытых моделей можно оставить пустым
  VLLM_API_KEY: "REPLACE_ME"     # Bearer-токен, который клиенты передают в заголовке Authorization